services:
  postgres:
    image: postgres:16-alpine
    container_name: logpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: logpulse_db
      POSTGRES_USER: logpulse_user
      POSTGRES_PASSWORD: logpulse_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logpulse_user -d logpulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logpulse-net

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: logpulse-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://logpulse_user:logpulse_password@postgres:5432/logpulse_db
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    networks:
      - logpulse-net

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: logpulse-dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    networks:
      - logpulse-net

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: logpulse-prometheus
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - logpulse-net

  simulator:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: logpulse-simulator
    profiles: ["simulation"]
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "scripts/generate_traffic.py", "--target-url", "http://api:8000/api/v1/ingest/stream", "--rate", "50", "--duration", "0", "--profile", "mixed"]
    networks:
      - logpulse-net

networks:
  logpulse-net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
