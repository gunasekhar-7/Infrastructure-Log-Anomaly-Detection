[DRAIN]
# Similarity threshold (0.0 to 1.0)
sim_th = 0.5
# Depth of the parse tree
depth = 4
# Max number of children of an internal node
max_children = 100
# Max number of clusters
max_clusters = 1024
# Parameter extraction delimiter
extra_delimiters = ["_", ":", "="]

[SNAPSHOT]
# Snapshot interval (number of lines between saves, 0 = disabled)
snapshot_interval_minutes = 5
compress_state = True

